[package]
name = "picoview-app"
version = "0.1.0"
description = "A fast, lightweight cross-platform photo viewer inspired by Google Picasa"
edition = "2021"

[lib]
name = "picoview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
picoview-core = { path = "../crates/picoview-core" }
tauri = { version = "2.0.0", features = ["protocol-asset"] }
tauri-plugin-opener = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["sync", "rt", "fs"] }
anyhow = "1.0"
trash = "5.1"
